<!DOCTYPE html>
<html lang="es">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Mi Blog Glitter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top py-3" style="background-color: var(--color-gris-oscuro);">
  <div class="container-fluid justify-content-center">
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto text-center fs-5" style="gap: 40px;">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about.html">Quiénes somos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact.html">Contacto</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<section class="py-5" style="margin-top: 90px;">
  <div class="container-fluid">
    <div class="row">
      <div class="col-lg-2 col-md-1">
        <!-- Espacio reservado para publicidad futura -->
      </div>
      <div class="col-lg-8 col-md-10 p-4 rounded" style="background-color: var(--color-crema);">
        <h1>Contacto</h1>
        <p>Nombre: Amy Lobo</p>
        <p>Correo: amy.lobo@correo.com</p>
        <p>Teléfono: 555-123-4567</p>

        <form id="formContacto" class="mt-4">
          <div class="mb-3">
            <label for="correoUsuario" class="form-label">Tu correo electrónico</label>
            <input type="email" class="form-control" id="correoUsuario" placeholder="nombre@ejemplo.com" required>
          </div>
          <div class="mb-3">
            <label for="mensajeUsuario" class="form-label">Tu mensaje</label>
            <textarea class="form-control" id="mensajeUsuario" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn" style="background-color: var(--color-rosa); color: white;">Enviar</button>
        </form>

        <div id="alertaEnviado" class="alert alert-success alert-dismissible fade show mt-3 d-none" role="alert">
          Mensaje enviado
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      </div>
      <div class="col-lg-2 col-md-1">
        <!-- Espacio reservado para artículos de noticias futuros -->
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <p>Autor: Amy Lobo</p>
  <p>Contacto: amy.lobo@correo.com</p>
  <p>Proyecto: Blog del Glitter</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="script.js"></script>

</body>
</html>
